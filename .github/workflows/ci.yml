name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci
      - name: Bundle the app and the iOS share extension
        run: |
          npx expo export:embed --entry-file index.js --platform android --dev false --bundle-output /tmp/main.android.js --assets-dest /tmp/assets-android
          npx expo export:embed --entry-file index.share.js --platform ios --dev false --bundle-output /tmp/share.ios.js --assets-dest /tmp/assets-share
      - name: Native projects generate
        run: npx expo prebuild --no-install --clean

  android:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Release build (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
